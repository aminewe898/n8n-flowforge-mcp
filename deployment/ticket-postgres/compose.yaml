name: ticket-db-v1

services:
  ticket-postgres:
    image: postgres:18.6-bookworm
    container_name: ticket-postgres-v1
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 256mb
    environment:
      POSTGRES_USER: ticket_bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/ticket_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
      PGDATA: /var/lib/postgresql/18/docker
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/ticket_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
    # Deliberately no ports and no n8n service or n8n data mounts.
    volumes:
      - ticket_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./bootstrap:/opt/ticket/bootstrap:ro
      - ./migrations:/opt/ticket/migrations:ro
      - ./healthcheck.sh:/opt/ticket/healthcheck.sh:ro
      - ./pg_hba.conf:/etc/postgresql/ticket_hba.conf:ro
    secrets:
      - ticket_admin_password
      - ticket_runtime_password
    networks:
      ticket_private:
        aliases:
          - ticket-postgres
    healthcheck:
      test: [CMD-SHELL, "bash /opt/ticket/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  ticket_data:
    name: ticket-pg18-data

networks:
  ticket_private:
    name: ticket-db-private
    driver: bridge
    internal: true

secrets:
  ticket_admin_password:
    file: ${TICKET_ADMIN_SECRET_FILE:?Set a secret file path in the local .env}
  ticket_runtime_password:
    file: ${TICKET_RUNTIME_SECRET_FILE:?Set a secret file path in the local .env}
